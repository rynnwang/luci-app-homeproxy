name: Build ipk (iStoreOS / OpenWrt 24.10 x86_64)

on:
  # Branch pushes and version tags. No `paths` filter here: a tag push carries
  # no file diff, so a paths filter would silently skip release builds.
  push:
    branches: [ master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, dev ]
    paths:
      - 'htdocs/**'
      - 'root/**'
      - 'po/**'
      - 'patches/**'
      - 'Makefile'
      - '.github/scripts/build.sh'
      - '.github/workflows/build.yml'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt release to build against'
        required: false
        default: '24.10.2'

permissions:
  contents: write

# Serialise release publishing per ref so the rolling `continuous` tag/release
# is never updated by two runs at once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '24.10.2' }}
      TARGET: x86
      SUBTARGET: '64'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      - name: Determine release channel and version
        id: meta
        run: |
          # Base version comes from the metadata patch, so it stays in sync when
          # PKG_VERSION is bumped there (no duplicated constant to maintain).
          base="$(grep -oP 'PKG_VERSION:=\K.*' patches/0001-makefile-explicit-metadata.patch | head -n1)"
          base="${base:-0.0.0}"
          sha="$(git rev-parse --short HEAD)"
          date="$(git show -s --format=%cd --date=format:%Y%m%d%H%M%S HEAD)"

          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "release" ]; then
            # Stable release: version = tag name with any leading 'v' stripped.
            channel="stable"
            version="${GITHUB_REF_NAME#v}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Every commit to a tracked branch: rolling pre-release.
            channel="continuous"
            version="${base}~git${date}.${sha}"
          else
            # PRs and manual dispatch: build only, no release.
            channel="none"
            version=""
          fi

          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Channel: ${channel}  Version: ${version:-<patch default>}"

      - name: Build .ipk
        env:
          HP_PKG_VERSION: ${{ steps.meta.outputs.version }}
        run: bash .github/scripts/build.sh

      - name: Upload run artifact
        if: steps.meta.outputs.channel != 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-homeproxy-${{ env.OPENWRT_VERSION }}-x86_64
          path: artifacts/*.ipk
          if-no-files-found: error

      - name: Publish stable release
        if: steps.meta.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --title "$tag" \
              --notes "Automated build of luci-app-homeproxy $tag for iStoreOS / OpenWrt ${OPENWRT_VERSION} (x86_64)."
          gh release upload "$tag" artifacts/*.ipk --clobber

      - name: Publish continuous pre-release
        if: steps.meta.outputs.channel == 'continuous'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Replace the single rolling "continuous" release so the Releases page
          # always shows exactly one newest build to download directly.
          gh release delete continuous --yes --cleanup-tag 2>/dev/null || true
          gh release create continuous artifacts/*.ipk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Continuous build ${VERSION}" \
            --notes "$(printf '%s\n' \
              "Latest automatic build from \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\`." \
              "" \
              "- Version: \`${VERSION}\`" \
              "- Target: iStoreOS / OpenWrt ${OPENWRT_VERSION} (x86_64)" \
              "" \
              "This pre-release is rebuilt on every commit; the file name carries the version. For pinned, stable versions use a \`vX.Y.Z\` tagged release instead.")"
