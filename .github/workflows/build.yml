name: Build ipk (iStoreOS / OpenWrt 24.10 x86_64)

on:
  push:
    branches: [ master, dev ]
    paths:
      - 'htdocs/**'
      - 'root/**'
      - 'po/**'
      - 'patches/**'
      - 'Makefile'
      - '.github/scripts/build.sh'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ master, dev ]
    paths:
      - 'htdocs/**'
      - 'root/**'
      - 'po/**'
      - 'patches/**'
      - 'Makefile'
      - '.github/scripts/build.sh'
      - '.github/workflows/build.yml'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt release to build against'
        required: false
        default: '24.10.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '24.10.2' }}
      TARGET: x86
      SUBTARGET: '64'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      - name: Derive package version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .ipk
        env:
          HP_PKG_VERSION: ${{ steps.ver.outputs.value }}
        run: bash .github/scripts/build.sh

      - name: Upload build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-homeproxy-${{ env.OPENWRT_VERSION }}-x86_64
          path: artifacts/*.ipk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
